name: Paired quality runner benchmark

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ci-quality-benchmark.yml'
      - 'tests/ci-quality/benchmark.py'
      - 'docs/ci-quality-benchmark.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paired:
    name: Pair ${{ matrix.pair }} ${{ matrix.arm }} cold and warm
    runs-on: ubuntu-24.04
    # Full quality can stall on registry/package infrastructure. Bound runner
    # occupancy; incomplete/failing receipts are ineligible for adoption.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - pair: '1'
            arm: baseline
          - pair: '1'
            arm: image
          - pair: '2'
            arm: image
          - pair: '2'
            arm: baseline
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify benchmark parsing and exclusions
        run: python3 tests/ci-quality/benchmark.py --self-test

      - name: Start cold measurement before baseline Node setup
        run: python3 tests/ci-quality/benchmark.py --arm '${{ matrix.arm }}' --pair '${{ matrix.pair }}' --sample cold --mark

      - uses: actions/setup-node@v4
        if: matrix.arm == 'baseline'
        with:
          node-version: 22.23.4

      - name: Measure cold full quality
        run: python3 tests/ci-quality/benchmark.py --arm '${{ matrix.arm }}' --pair '${{ matrix.pair }}' --sample cold

      - name: Start warm measurement
        run: python3 tests/ci-quality/benchmark.py --arm '${{ matrix.arm }}' --pair '${{ matrix.pair }}' --sample warm --mark

      - uses: actions/setup-node@v4
        if: matrix.arm == 'baseline'
        with:
          node-version: 22.23.4

      - name: Measure same-job warm full quality
        run: python3 tests/ci-quality/benchmark.py --arm '${{ matrix.arm }}' --pair '${{ matrix.pair }}' --sample warm

      - name: Finalize any interrupted or skipped samples
        if: always()
        run: python3 tests/ci-quality/benchmark.py --arm '${{ matrix.arm }}' --pair '${{ matrix.pair }}' --finalize

      - name: Explain incomplete measurements
        if: failure() || cancelled()
        run: echo 'A measured phase failed or the 35-minute runner occupancy deadline was reached; incomplete samples are ineligible for adoption. Existing active CI is unchanged.' >&2

      - name: Upload numeric timing and test parity receipts only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-benchmark-pair-${{ matrix.pair }}-${{ matrix.arm }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quality-pair-${{ matrix.pair }}-${{ matrix.arm }}/receipts/*.json
          if-no-files-found: warn
          retention-days: 30

  compare:
    name: Compare complete paired receipts
    needs: paired
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: quality-benchmark-pair-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/paired-receipts
      - name: Require complete source and pass/skip parity
        if: always()
        run: python3 tests/ci-quality/benchmark.py --summarize "$RUNNER_TEMP/paired-receipts" --output "$RUNNER_TEMP/comparison.json"
      - name: Retain comparison including ineligible outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-benchmark-comparison-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/comparison.json
          retention-days: 30
          if-no-files-found: warn
