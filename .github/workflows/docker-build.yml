name: Build and Push Docker Images

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      orchestrator: ${{ steps.filter.outputs.orchestrator }}
      worker: ${{ steps.filter.outputs.worker }}
      validation: ${{ steps.filter.outputs.validation }}
      force: ${{ steps.scope.outputs.force }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            orchestrator:
              - 'orchestrator/**'
              - '.github/workflows/docker-build.yml'
            worker:
              - 'worker/**'
              - '.github/workflows/docker-build.yml'
            validation:
              - 'orchestrator/**'
              - 'worker/**'
              - 'tests/**'
              - 'docker-compose.tests.yml'
              - '.github/workflows/docker-build.yml'

      - name: Select full validation for tags and manual runs
        id: scope
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" || "$GITHUB_REF" == refs/tags/* ]]; then
            echo "force=true" >> "$GITHUB_OUTPUT"
          else
            echo "force=false" >> "$GITHUB_OUTPUT"
          fi

  quality:
    name: Typecheck and module tests
    needs: changes
    if: needs.changes.outputs.validation == 'true' || needs.changes.outputs.force == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            orchestrator/package-lock.json
            tests/package-lock.json

      - name: Install orchestrator dependencies
        working-directory: orchestrator
        run: npm ci --no-audit --no-fund

      - name: Install test dependencies
        working-directory: tests
        run: npm ci --no-audit --no-fund

      - name: Typecheck orchestrator
        working-directory: orchestrator
        run: npm run typecheck

      - name: Run no-server module and helper tests
        working-directory: tests
        run: npm run test:modules

  docker_regression:
    name: Isolated Docker API and UI regression
    needs: changes
    if: needs.changes.outputs.validation == 'true' || needs.changes.outputs.force == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Report runner capacity
        shell: bash
        run: |
          df -h /
          docker system df
          available_kib=$(df --output=avail / | tail -n 1)
          # A measured warm run occupies about 12.5 GiB across the outer
          # runner image and nested-Docker volume. Require another ~3.5 GiB
          # for cold-build transient layers, npm installs, and artifacts.
          minimum_kib=$((16 * 1024 * 1024))
          if (( available_kib < minimum_kib )); then
            echo "At least 16 GiB of free disk is required for the isolated DinD build and tests." >&2
            exit 1
          fi

      - name: Run bounded isolated regression suite
        working-directory: tests
        run: npm run test:docker:ci

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tests/playwright-report/
            tests/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove isolated test state
        if: always()
        run: docker compose -f docker-compose.tests.yml down -v --remove-orphans

  test_gate:
    name: CI test gate
    needs: [changes, quality, docker_regression]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CHANGES_RESULT: ${{ needs.changes.result }}
      VALIDATION_REQUIRED: ${{ needs.changes.outputs.validation == 'true' || needs.changes.outputs.force == 'true' }}
      QUALITY_RESULT: ${{ needs.quality.result }}
      REGRESSION_RESULT: ${{ needs.docker_regression.result }}
    steps:
      - name: Enforce validation results
        shell: bash
        run: |
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Change detection did not succeed: $CHANGES_RESULT" >&2
            exit 1
          fi
          if [[ "$VALIDATION_REQUIRED" != "true" ]]; then
            echo "No image, runtime, or test-harness changes require validation."
            exit 0
          fi
          if [[ "$QUALITY_RESULT" != "success" || "$REGRESSION_RESULT" != "success" ]]; then
            echo "Required validation did not succeed (quality=$QUALITY_RESULT, regression=$REGRESSION_RESULT)." >&2
            exit 1
          fi
          echo "All required validation jobs succeeded."

  build-orchestrator:
    needs: [changes, test_gate]
    if: >-
      always() &&
      needs.changes.result == 'success' &&
      needs.test_gate.result == 'success' &&
      (needs.changes.outputs.orchestrator == 'true' || needs.changes.outputs.force == 'true')
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            suffix: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/agentor-orchestrator

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: ./orchestrator
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ github.repository_owner }}/agentor-orchestrator,push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=orchestrator-${{ matrix.suffix }}
          cache-to: type=gha,scope=orchestrator-${{ matrix.suffix }},mode=max

      - if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          echo "$digest" > "/tmp/digests/${{ matrix.suffix }}"

      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: orchestrator-digest-${{ matrix.suffix }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-orchestrator:
    needs: build-orchestrator
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: orchestrator-digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/agentor-orchestrator
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - run: |
          cd /tmp/digests
          IMAGE=${{ env.REGISTRY }}/${{ github.repository_owner }}/agentor-orchestrator
          TAGS=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          SOURCES=$(for f in *; do echo "$IMAGE@$(cat $f)"; done)
          docker buildx imagetools create $TAGS $SOURCES

  build-worker:
    needs: [changes, test_gate]
    if: >-
      always() &&
      needs.changes.result == 'success' &&
      needs.test_gate.result == 'success' &&
      (needs.changes.outputs.worker == 'true' || needs.changes.outputs.force == 'true')
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            suffix: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/agentor-worker

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: ./worker
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ github.repository_owner }}/agentor-worker,push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=worker-${{ matrix.suffix }}
          cache-to: type=gha,scope=worker-${{ matrix.suffix }},mode=max

      - if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          echo "$digest" > "/tmp/digests/${{ matrix.suffix }}"

      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: worker-digest-${{ matrix.suffix }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-worker:
    needs: build-worker
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: worker-digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/agentor-worker
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - run: |
          cd /tmp/digests
          IMAGE=${{ env.REGISTRY }}/${{ github.repository_owner }}/agentor-worker
          TAGS=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          SOURCES=$(for f in *; do echo "$IMAGE@$(cat $f)"; done)
          docker buildx imagetools create $TAGS $SOURCES
