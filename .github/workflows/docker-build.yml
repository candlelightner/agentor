name: Build and Push Docker Images

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      orchestrator: ${{ steps.filter.outputs.orchestrator }}
      worker: ${{ steps.filter.outputs.worker }}
      validation: ${{ steps.filter.outputs.validation }}
      force: ${{ steps.scope.outputs.force }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            orchestrator:
              - 'orchestrator/**'
              - 'worker/vm/**'
              - 'worker/entrypoint.sh'
              - 'scripts/build-incus-worker-image.sh'
              - 'scripts/incus-canary.mjs'
              - '.dockerignore'
              - '.github/workflows/docker-build.yml'
            worker:
              - 'worker/**'
              - '.github/workflows/docker-build.yml'
            validation:
              - 'orchestrator/**'
              - 'worker/**'
              - 'scripts/build-incus-worker-image.sh'
              - 'scripts/incus-canary.mjs'
              - 'scripts/incus-admin-network-policy.py'
              - 'scripts/setup-incus-host.sh'
              - 'scripts/profile-ci-workflow.py'
              - '.dockerignore'
              - 'tests/**'
              - 'docker-compose.tests.yml'
              - '.github/workflows/docker-build.yml'

      - name: Select full validation for tags and manual runs
        id: scope
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" || "$GITHUB_REF" == refs/tags/* ]]; then
            echo "force=true" >> "$GITHUB_OUTPUT"
          else
            echo "force=false" >> "$GITHUB_OUTPUT"
          fi

  quality:
    name: Typecheck and module tests
    needs: changes
    if: needs.changes.outputs.validation == 'true' || needs.changes.outputs.force == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            orchestrator/package-lock.json
            tests/package-lock.json

      - name: Install orchestrator dependencies
        working-directory: orchestrator
        run: npm ci --no-audit --no-fund

      - name: Install test dependencies
        working-directory: tests
        run: npm ci --no-audit --no-fund

      - name: Install module test system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-utils

      - name: Install locked Playwright Chromium and system dependencies
        working-directory: tests
        run: npx --no-install playwright install --with-deps chromium

      - name: Typecheck orchestrator
        working-directory: orchestrator
        run: npm run typecheck

      - name: Run no-server module and helper tests
        working-directory: tests
        run: npm run test:modules -- --grep-invert 'api/(incus-admin-restore|incus-derived-image|incus-docker-restore-archive|incus-selected-restore|managed-kilo-parent|portable-pax-size)\.spec\.ts'

      - name: Verify CI profiler
        run: python3 scripts/profile-ci-workflow.py --self-test

      - name: Run root-owned archive metadata fixtures
        working-directory: tests
        run: >-
          sudo -- "$(command -v node)" ./node_modules/@playwright/test/cli.js test
          --config=playwright.modules.config.ts
          api/incus-admin-restore.spec.ts api/incus-derived-image.spec.ts
          api/incus-docker-restore-archive.spec.ts api/incus-selected-restore.spec.ts
          api/managed-kilo-parent.spec.ts
          api/portable-pax-size.spec.ts

  docker_regression:
    name: Isolated Docker API and UI regression
    needs: changes
    if: needs.changes.outputs.validation == 'true' || needs.changes.outputs.force == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Report runner capacity
        shell: bash
        run: |
          df -h /
          docker system df
          available_kib=$(df --output=avail / | tail -n 1)
          # The previous Docker-only warm footprint was about 12.5 GiB.
          # Allow extra space for BuildKit's temporary image/load copies.
          # Record sampled headroom below; this is a conservative admission
          # requirement, not a claim about measured peak usage.
          minimum_kib=$((24 * 1024 * 1024))
          if (( available_kib < minimum_kib )); then
            echo "At least 24 GiB of free disk is required for the isolated DinD build and tests." >&2
            exit 1
          fi
          # Keep sampling across source builds, regression, and cleanup steps.
          export AGENTOR_DISK_SAMPLES="$RUNNER_TEMP/agentor-ci-disk-kib.txt"
          nohup bash -c 'while true; do df --output=avail / | tail -n 1 >> "$AGENTOR_DISK_SAMPLES"; sleep 10; done' </dev/null >/dev/null 2>&1 &
          echo "$!" > "$RUNNER_TEMP/agentor-ci-disk-sampler.pid"

      - name: Export masked runtime cache credentials
        uses: actions/github-script@v7
        with:
          script: |
            for (const name of ['ACTIONS_RUNTIME_TOKEN', 'ACTIONS_RESULTS_URL']) {
              const value = process.env[name];
              if (!value) throw new Error(`Missing Actions runtime variable: ${name}`);
              if (name === 'ACTIONS_RUNTIME_TOKEN') core.setSecret(value);
              core.exportVariable(name, value);
            }

      - name: Run bounded isolated regression suite
        working-directory: tests
        env:
          AGENTOR_TEST_GHA_CACHE: 'true'
        run: npm run test:docker:ci

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tests/playwright-report/
            tests/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove isolated test state
        if: always()
        run: docker compose -f docker-compose.tests.yml down -v --remove-orphans

      - name: Report sampled disk headroom
        if: always()
        shell: bash
        run: |
          pid_file="$RUNNER_TEMP/agentor-ci-disk-sampler.pid"
          samples="$RUNNER_TEMP/agentor-ci-disk-kib.txt"
          if [[ -f "$pid_file" ]]; then
            kill "$(cat "$pid_file")" 2>/dev/null || true
            df --output=avail / | tail -n 1 >> "$samples"
            awk 'NR == 1 || $1 < minimum { minimum = $1 } END { printf "Minimum sampled available disk: %.2f GiB (10s samples)\n", minimum / 1048576 }' "$samples"
          fi

  test_gate:
    name: CI test gate
    needs: [changes, quality, docker_regression]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CHANGES_RESULT: ${{ needs.changes.result }}
      VALIDATION_REQUIRED: ${{ needs.changes.outputs.validation == 'true' || needs.changes.outputs.force == 'true' }}
      QUALITY_RESULT: ${{ needs.quality.result }}
      REGRESSION_RESULT: ${{ needs.docker_regression.result }}
    steps:
      - name: Enforce validation results
        shell: bash
        run: |
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Change detection did not succeed: $CHANGES_RESULT" >&2
            exit 1
          fi
          if [[ "$VALIDATION_REQUIRED" != "true" ]]; then
            echo "No image, runtime, or test-harness changes require validation."
            exit 0
          fi
          if [[ "$QUALITY_RESULT" != "success" || "$REGRESSION_RESULT" != "success" ]]; then
            echo "Required validation did not succeed (quality=$QUALITY_RESULT, regression=$REGRESSION_RESULT)." >&2
            exit 1
          fi
          echo "All required validation jobs succeeded."

  build-orchestrator:
    needs: [changes, test_gate]
    if: >-
      always() &&
      needs.changes.result == 'success' &&
      needs.test_gate.result == 'success' &&
      (needs.changes.outputs.orchestrator == 'true' || needs.changes.outputs.force == 'true')
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            suffix: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/agentor-orchestrator

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: ./orchestrator/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ github.repository_owner }}/agentor-orchestrator,push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=orchestrator-${{ matrix.suffix }}
          cache-to: type=gha,scope=orchestrator-${{ matrix.suffix }},mode=max

      - if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          echo "$digest" > "/tmp/digests/${{ matrix.suffix }}"

      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: orchestrator-digest-${{ matrix.suffix }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-orchestrator:
    needs: build-orchestrator
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: orchestrator-digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/agentor-orchestrator
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - run: |
          cd /tmp/digests
          IMAGE=${{ env.REGISTRY }}/${{ github.repository_owner }}/agentor-orchestrator
          TAGS=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          SOURCES=$(for f in *; do echo "$IMAGE@$(cat $f)"; done)
          docker buildx imagetools create $TAGS $SOURCES

  build-worker:
    needs: [changes, test_gate]
    if: >-
      always() &&
      needs.changes.result == 'success' &&
      needs.test_gate.result == 'success' &&
      (needs.changes.outputs.worker == 'true' || needs.changes.outputs.force == 'true')
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            suffix: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/agentor-worker

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: ./worker
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ github.repository_owner }}/agentor-worker,push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=worker-${{ matrix.suffix }}
          cache-to: type=gha,scope=worker-${{ matrix.suffix }},mode=max

      - if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          echo "$digest" > "/tmp/digests/${{ matrix.suffix }}"

      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: worker-digest-${{ matrix.suffix }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-worker:
    needs: build-worker
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: worker-digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/agentor-worker
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - run: |
          cd /tmp/digests
          IMAGE=${{ env.REGISTRY }}/${{ github.repository_owner }}/agentor-worker
          TAGS=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          SOURCES=$(for f in *; do echo "$IMAGE@$(cat $f)"; done)
          docker buildx imagetools create $TAGS $SOURCES
